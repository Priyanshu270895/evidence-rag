[project]
name = "evidence-rag"
version = "0.1.0"
description = "A local-first, citation-grounded production RAG system"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.1,<6",
  "python-multipart>=0.0.20,<1",
  "sentence-transformers>=3.3,<4",
  "numpy>=1.26,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

